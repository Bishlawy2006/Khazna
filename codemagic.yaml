# Codemagic CI config for Khazna.
# Produces an UNSIGNED .ipa that Sideloadly (Windows) signs with your Apple ID
# and installs on your iPhone. No Apple Developer account needed for this step.

workflows:
  ios-unsigned-ipa:
    name: Khazna iOS (unsigned IPA for Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.6   # matches the local toolchain; change to "stable" if Codemagic rejects it
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        # Swift Package Manager is switched off so plugins build through
        # CocoaPods. With SPM on, an unsigned device build can fail with
        # "requires a development team" (package resource bundles want signing).
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build iOS release without code signing
        # Verbose output is saved, and on failure the real Xcode error lines are
        # printed at the end (the default log only shows a generic message).
        script: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee build.log || {
            echo "=== 70 LINES BEFORE THE FIRST SCRIPT FAILURE ==="
            grep -n -B70 -m1 "Command PhaseScriptExecution failed" build.log
            echo "=== SCRIPT PHASES SEEN ==="
            grep -n "PhaseScriptExecution" build.log | head -15
            echo "=== ERROR LINES ==="
            grep -n -E "error:|Error \(Xcode\)|requires a development team|Signing for" build.log | head -40
            exit 1
          }
      - name: Package Runner.app into an .ipa
        # An .ipa is just a zip containing Payload/<App>.app
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr Khazna-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/Khazna-unsigned.ipa
